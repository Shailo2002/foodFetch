
services:
  frontend:
    build:
      context: ./frontend
    container_name: foodfetch-frontend
    restart: always
    env_file:
      - ./frontend/.env
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: foodfetch-backend
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
